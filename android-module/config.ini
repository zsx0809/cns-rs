# ============ cns-rs 模块全局配置 ============
# 说明：端口/上游等运行参数以 modes/<模式>.json 为唯一真源。
#       本文件只提供「模式选择 + 少量调度开关」，
#       留空的覆盖项不要填，填了会同时改 iptables 与客户端，绝不会两边不一致。

# 模式名称（对应 modes/<名字>.json）
modeName='联通'

# 开机自启（1 开启，0 关闭；仅 Magisk / KernelSU / APatch 生效）
autoStart='0'

# --- 以下为可选覆盖项，留空即沿用模式 JSON ---

# 覆盖透明代理监听端口（同时写进 iptables 与 cns-client，不会出现两边不一致）
tproxy_port=''

# 劫持方式：redirect（默认，Android 内核最稳）| tproxy（需 ip rule 策略路由）
# 必须与 modes/<模式>.json 的 tproxy_mode 写成同一个值：两边不一致时开启会被
# 一致性自检拦下（否则会静默出现「iptables 按一种方式抓包、客户端按另一种解析」→ 全断网无报错）。
# 留空（tproxy_mode=''）= 完全以模式 JSON 为准。
tproxy_mode='redirect'

# 放行 WiFi（1 放行不走代理，0 一起代理）
allowWifi='1'

# 拦截 QUIC/UDP 443，促使 App 秒级回退到 TCP TLS（1 拦截，0 放行）
# 与 modes/<模式>.json 的 block_ipv6 联动：block_ipv6=true（默认）时用 DROP（软失败，
# App 按超时回退 TCP），否则用 REJECT --reject-with icmp-port-unreachable（原行为）。
blockQuic='1'

# 放行 127.0.0.0/8（部分 ROM 的 netd 本机解析走这里，拦截会导致解析全挂）
protectLocalDns='1'

# 放行应用：可填 UID 或包名，多个用空格分隔
allowApps=''
