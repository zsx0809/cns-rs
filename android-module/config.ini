# ============ cns-rs 模块全局配置 ============
# 说明：端口/上游等运行参数以 modes/<模式>.json 为唯一真源。
#       本文件只提供「模式选择 + 少量调度开关」，
#       留空的覆盖项不要填，填了会同时改 iptables 与客户端，绝不会两边不一致。

# 模式名称（对应 modes/<名字>.json）
#   CX   - 电信 5G CTWAP 彩信免流（直连 10.0.0.200:80，APN 需设为 ctwap，5G 不计流量，无需自建 VPS）
#   BD   - 联通百度直连免流（直连百度中转集群，无需自建 VPS）
#   联通 / 美国 / 英国 - 传统自建 CNS-Server 私有加密隧道
modeName='联通'

# ============ 百度模式专属配置（仅在 modeName='BD' 时生效）============
# 百度中转节点 IP（高峰期卡顿时可在此指定低延迟节点，端口留空默认 443；留空则沿用 BD.json 的 163.177.17.189）
# 备选节点例：163.177.17.189、157.0.146.158
bd_ip=''

# 百度模式专属白名单域名（留空默认 wx.tenpay.com）
# 常见稳定白名单：wx.tenpay.com、mclient.alipay.com
bd_whitelist=''

# 开机自启（1 开启，0 关闭；仅 Magisk / KernelSU / APatch 生效）
autoStart='0'

# --- 以下为可选覆盖项，留空即沿用模式 JSON ---

# 覆盖透明代理监听端口（同时写进 iptables 与 cns-client，不会出现两边不一致）
tproxy_port=''

# 劫持方式：ebpf（最强现代化双栈零 iptables 拦截） | redirect（传统 iptables NAT 兼容模式）
tproxy_mode='ebpf'

# 放行 WiFi（1 放行不走代理，0 一起代理）
allowWifi='1'

# 拦截 QUIC/UDP 443，促使 App 秒级回退到 TCP TLS（1 拦截，0 放行）
# 与 modes/<模式>.json 的 block_ipv6 联动：block_ipv6=true（默认）时用 DROP（软失败，
# App 按超时回退 TCP），否则用 REJECT --reject-with icmp-port-unreachable（原行为）。
blockQuic='1'

# 放行 127.0.0.0/8（部分 ROM 的 netd 本机解析走这里，拦截会导致解析全挂）
protectLocalDns='1'

# 放行应用：可填 UID 或包名，多个用空格分隔
allowApps=''
