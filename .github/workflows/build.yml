name: CI & Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo Test
        run: cargo test --workspace

  build:
    name: Build Binaries & Packages
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: Install musl tools & cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3

      - name: Build cns-server (x86_64-unknown-linux-musl)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p cns-server
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/cns-server dist/cns-server-x86_64
          strip dist/cns-server-x86_64

      - name: Build cns-server (aarch64-unknown-linux-musl)
        run: |
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc \
          CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc \
          cargo build --release --target aarch64-unknown-linux-musl -p cns-server
          cp target/aarch64-unknown-linux-musl/release/cns-server dist/cns-server-aarch64
          aarch64-linux-gnu-strip dist/cns-server-aarch64

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Build cns-client (aarch64-linux-android)
        run: |
          TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          CLANG=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          AR=$TOOLCHAIN/bin/llvm-ar
          STRIP=$TOOLCHAIN/bin/llvm-strip
          
          CC_aarch64_linux_android=$CLANG \
          CXX_aarch64_linux_android=${CLANG}++ \
          AR_aarch64_linux_android=$AR \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG \
          cargo build --release --target aarch64-linux-android -p cns-client
          
          cp target/aarch64-linux-android/release/cns-client dist/cns-client-aarch64
          $STRIP dist/cns-client-aarch64

      - name: Package Magisk / KernelSU module
        run: |
          cp dist/cns-client-aarch64 android-module/Core/cns-client
          python3 scripts/build_module.py

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum cns-server-x86_64 > cns-server-x86_64.sha256
          sha256sum cns-server-aarch64 > cns-server-aarch64.sha256
          sha256sum cns-client-aarch64 > cns-client-aarch64.sha256
          sha256sum cns-server-x86_64 cns-server-aarch64 cns-client-aarch64 > sha256sums.txt
          cat sha256sums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cns-rs-dist
          path: dist/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
