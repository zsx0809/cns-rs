[package]
name = "cns-core"
version = "0.1.0"
edition = "2021"
authors = ["CuteBi Modernizers"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1"
socket2 = { version = "0.5", features = ["all"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
libc = "0.2"
